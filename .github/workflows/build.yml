name: Build and Release

on:
  push:
    tags:
      - 'v*'
      - 'release/*'
  workflow_dispatch:

env:
  UNITY_VERSION: "6000.3.18f1"
  VERSION: "0.0.9"

jobs:
  build-android:
    runs-on: ubuntu-latest
    name: Build Android APK
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        with:
          unityVersion: auto
          targetPlatform: Android
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
      - name: Prepare APK for container
        run: |
          mkdir -p images/apk
          APK_PATH=$(find build -name "*.apk" -type f | head -1)
          if [ -n "$APK_PATH" ]; then
            echo "Found APK: $APK_PATH"
            cp "$APK_PATH" "images/apk/SafeStepsAddis-${{ env.VERSION }}.apk"
            echo "APK copied to container directory"
          else
            echo "APK not found after build"
            find build -name "*.apk" -type f 2>/dev/null || true
            exit 1
          fi
      - name: Docker metadata
        uses: crazy-max/ghaction-docker-meta@v1
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/sgame
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ env.UNITY_VERSION }}
      - name: Build and Push Container Image
        run: |
          cd images
          docker build \
            -f Dockerfile.apk \
            -t ghcr.io/${{ github.repository_owner }}/sgame:${{ env.VERSION }} \
            --build-arg APK_NAME="SafeStepsAddis-${{ env.VERSION }}.apk" \
            .
          docker push ghcr.io/${{ github.repository_owner }}/sgame:${{ env.VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create GitHub Release (Version ${{ env.VERSION }})
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          body: |
            ## Safe Steps Addis - Version v${{ env.VERSION }}

            ### What's Included?
            - Android APK built with Unity ${{ env.UNITY_VERSION }}
            - Container image in GitHub Container Registry
            - Ready for deployment to testing environment

            ### Building from
            - Branch: ${{ github.ref_name }}
            - Commit: ${{ github.sha }}
            - Built on: ${{ github.workflow_run }}
          draft: false
          prerelease: false
          generateReleaseNotes: true

  security-scan:
    runs-on: ubuntu-latest
    name: Security Scan
    if: always() && needs.build-android.result == 'success'
    needs: build-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run Snyk
        uses: snyk/actions/docker@master
        with:
          image: ghcr.io/${{ github.repository_owner }}/sgame:${{ env.VERSION }}
          args: --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true
      - name: Download container image
        run: |
          echo "Scanning GitHub Container Registry image"
          echo "Image: ghcr.io/${{ github.repository_owner }}/sgame:${{ env.VERSION }}"
          docker pull ghcr.io/${{ github.repository_owner }}/sgame:${{ env.VERSION }} || echo "Container pull failed (expected if image not pushed yet)"

  deploy-staging:
    runs-on: ubuntu-latest
    name: Deploy to Staging (Manual Only)
    needs: build-android
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy to Staging
        run: |
          echo "Deploying to staging environment..."
          echo "Version: ${{ env.VERSION }}"
          echo "This would deploy to staging servers via SSH/ANSIBLE"
          echo "Release artifacts: APK and container image"
