name: Create Container Images

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to tag the container images'
        required: true
        default: '0.0.9'
      tag:
        description: 'Additional tag for the image'
        required: false
        default: ''

env:
  UNITY_VERSION: "2022.3.62f3"

jobs:
  create-images:
    runs-on: ubuntu-latest
    name: Create Container Images
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Download APK Artifact
        uses: actions/download-artifact@v3
        with:
          name: android-apk
          path: apk
      - name: List Downloaded Files
        run: |
          echo "=== Downloaded APK Files ==="
          find apk -type f -name "*.apk" | head -10
          echo "=== APK Details ==="
          ls -la apk/ || echo "No APK files found"
      - name: Build and Push AP APK Container
        run: |
          APK_NAME=$(ls apk/*.apk | head -1)
          APK_NAME=$(basename "$APK_NAME")
          if [ -n "$APK_NAME" ]; then
            echo "Building container with APK: $APK_NAME"
            docker build -f ${{ github.workspace }}/images/Dockerfile.apk ${{ github.workspace }} -t ghcr.io/${{ github.repository_owner }}/sgame:${{ github.event.inputs.version }} --build-arg APK_NAME="$APK_NAME"
            docker tag ghcr.io/${{ github.repository_owner }}/sgame:${{ github.event.inputs.version }} ghcr.io/${{ github.repository_owner }}/sgame:latest
            echo "Docker images built successfully"
            docker images | grep sgame
          else
            echo "ERROR: No APK file found for container build"
            exit 1
          fi
        env:
          DOCKER_BUILDKIT: 1
      - name: Authenticate to GitHub Container Registry
        run: |
          docker login ghcr.io -u ${{ github.actor }} --password-stdin <<< "${{ secrets.GITHUB_TOKEN }}"
      - name: Push Container Images
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/sgame:${{ github.event.inputs.version }}
          docker push ghcr.io/${{ github.repository_owner }}/sgame:latest
          if [ "${{ github.event.inputs.tag }}" != "" ]; then
            docker tag ghcr.io/${{ github.repository_owner }}/sgame:${{ github.event.inputs.version }} ghcr.io/${{ github.repository_owner }}/sgame:${{ github.event.inputs.tag }}
            docker push ghcr.io/${{ github.repository_owner }}/sgame:${{ github.event.inputs.tag }}
          fi
      - name: Create Container Registry Release
        uses: ncipollo/release-action@v1
        with:
          tag: container-${{ github.event.inputs.version }}
          name: Container Registry Release v${{ github.event.inputs.version }}
          body: |
            ## Container Images for Safe Steps Addis v${{ github.event.inputs.version }}

            ### Images Built
            - `ghcr.io/${{ github.repository_owner }}/sgame:${{ github.event.inputs.version }}` (version-specific)
            - `ghcr.io/${{ github.repository_owner }}/sgame:latest` (latest tag)

            ### APK Details
            - Built with Unity ${{ env.UNITY_VERSION }}
            - Platform: Android
            - Version: ${{ github.event.inputs.version }}

            ### Usage
            ```bash
            docker pull ghcr.io/${{ github.repository_owner }}/sgame:${{ github.event.inputs.version }}
            docker run -p 8080:8080 ghcr.io/${{ github.repository_owner }}/sgame:${{ github.event.inputs.version }}
            ```
          draft: false
          prerelease: false
          artifactErrorsFailBuild: false
