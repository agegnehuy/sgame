<style>
        .tactile-button {
            transition: all 0.1s ease-in-out;
            box-shadow: 0 6px 0 0 rgba(0, 0, 0, 0.1);
        }
        .tactile-button:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 0 rgba(0, 0, 0, 0.1);
        }
        .language-card {
            background: linear-gradient(180deg, rgba(255,255,255,0.9) 0%, rgba(255,255,255,1) 100%);
            border: 4px solid white;
        }
        .sun-ray {
            position: absolute;
            background: radial-gradient(circle, rgba(255,214,0,0.2) 0%, rgba(255,214,0,0) 70%);
            border-radius: 50%;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md min-h-screen relative overflow-hidden flex flex-col items-center">
<!-- Background Atmospheric Elements -->
<div class="absolute top-[-100px] right-[-100px] w-[400px] h-[400px] sun-ray z-0 animate-pulse"></div>
<div class="absolute bottom-[-50px] left-[-50px] w-[300px] h-[300px] sun-ray z-0"></div>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center w-full max-w-md px-md z-10 py-xl">
<!-- Header Section -->
<div class="text-center mb-xl">
<div class="mb-md inline-block p-xs rounded-xl bg-white shadow-lg transform rotate-[-3deg]">
<img alt="Kid player avatar" class="w-24 h-24 rounded-lg border-4 border-primary-container object-cover" data-alt="A friendly, high-quality 3D cartoon illustration of a young Ethiopian child wearing a yellow safety helmet and a bright green vest. The character is smiling warmly against a soft, sun-drenched suburban Addis Ababa background with modern buildings and green trees. The lighting is warm and cinematic, using a vibrant color palette of yellow, green, and bright blue to create a welcoming, educational atmosphere for children." src="https://lh3.googleusercontent.com/aida-public/AB6AXuARt5m9JdFfmuABTkagEK29DwdIONEslIbhcXLVndo0Sphsw1KmQzpVvO3rn2QXdMeUIsXQClAK60vB5fd7xk6cSl06O6EAzDeXRM0arB6Xjvhab0eF23hppRazetGTF_GxoaObXVhGCTjzIj-l4K4G-FhNQroQNyhXy5jJyY_-a6BB2QOFVXEYYmy2FbQ4Qxk3G70RgLulbd2uR9KFCxlXNXHSoEu1JOykHGc_yZiwVh-Oi0s0nRhYDuhhwjlqSWbPx9JYZqVWKPuq"/>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-sm leading-tight">
                Welcome to<br/>Safe Steps Addis!
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">
                Choose your language to start playing
            </p>
</div>
<!-- Language Selection Bento -->
<div class="w-full grid gap-md">
<!-- English Selection -->
<button class="tactile-button w-full language-card rounded-lg p-md flex items-center justify-between group hover:scale-[1.02] transition-transform" onclick="selectLanguage('en')">
<div class="flex items-center gap-md">
<div class="w-16 h-16 bg-tertiary-container rounded-full flex items-center justify-center border-4 border-white shadow-md">
<span class="material-symbols-outlined text-[32px] text-tertiary">language</span>
</div>
<div class="text-left">
<span class="block font-headline-md text-headline-md text-on-surface">English</span>
<span class="block font-label-lg text-label-lg text-on-surface-variant opacity-70">LEARN IN ENGLISH</span>
</div>
</div>
<div class="bg-tertiary text-white rounded-full p-xs shadow-inner group-hover:bg-primary transition-colors">
<span class="material-symbols-outlined">chevron_right</span>
</div>
</button>
<!-- Amharic Selection -->
<button class="tactile-button w-full language-card rounded-lg p-md flex items-center justify-between group hover:scale-[1.02] transition-transform" onclick="selectLanguage('am')">
<div class="flex items-center gap-md">
<div class="w-16 h-16 bg-secondary-container rounded-full flex items-center justify-center border-4 border-white shadow-md">
<span class="material-symbols-outlined text-[32px] text-secondary" style="font-variation-settings: 'FILL' 1;">translate</span>
</div>
<div class="text-left">
<span class="block font-headline-md text-headline-md text-on-surface">አማርኛ</span>
<span class="block font-label-lg text-label-lg text-on-surface-variant opacity-70">በአማርኛ ይማሩ</span>
</div>
</div>
<div class="bg-secondary text-white rounded-full p-xs shadow-inner group-hover:bg-primary transition-colors">
<span class="material-symbols-outlined">chevron_right</span>
</div>
</button>
</div>
<!-- Footer Help -->
<div class="mt-xl flex flex-col items-center gap-sm">
<button class="flex items-center gap-xs font-label-lg text-label-lg text-primary hover:underline">
<span class="material-symbols-outlined text-[18px]">help</span>
                Need help? Ask a parent
            </button>
<div class="flex items-center gap-base mt-md">
<div class="w-2 h-2 rounded-full bg-primary-container"></div>
<div class="w-2 h-2 rounded-full bg-surface-variant"></div>
<div class="w-2 h-2 rounded-full bg-surface-variant"></div>
</div>
</div>
</main>
<!-- Interactive Background Illustration (Abstract Buildings) -->
<div class="absolute bottom-0 w-full z-0 h-[176px] pointer-events-none overflow-hidden flex items-end justify-between px-md opacity-40">
<div class="w-24 h-48 bg-surface-container rounded-t-lg"></div>
<div class="w-32 h-64 bg-surface-container-high rounded-t-xl"></div>
<div class="w-20 h-40 bg-surface-container-low rounded-t-lg"></div>
<div class="w-40 h-56 bg-surface-variant rounded-t-2xl"></div>
</div>
<script>
        function selectLanguage(lang) {
            console.log('Language selected:', lang);
            
            // Visual feedback animation
            const buttons = document.querySelectorAll('.tactile-button');
            buttons.forEach(btn => btn.style.opacity = '0.5');
            
            const selectedBtn = event.currentTarget;
            selectedBtn.style.opacity = '1';
            selectedBtn.classList.add('scale-105');
            selectedBtn.style.borderColor = '#705d00';

            // Simulate navigation delay
            setTimeout(() => {
                alert(lang === 'am' ? 'ወደ Safe Steps Addis በደህና መጡ!' : 'Welcome to Safe Steps Addis!');
            }, 300);
        }

        // Add subtle floating effect to buildings
        document.addEventListener('mousemove', (e) => {
            const buildings = document.querySelectorAll('.z-0 > div');
            const x = (window.innerWidth / 2 - e.pageX) / 50;
            buildings.forEach((b, i) => {
                const shift = x * (i + 1) * 0.2;
                b.style.transform = `translateX(${shift}px)`;
            });
        });
    </script>
