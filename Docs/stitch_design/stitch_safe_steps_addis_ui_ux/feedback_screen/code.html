<!-- Simple Particle Layer (Scripted) -->
<canvas class="fixed inset-0 pointer-events-none z-20" id="celebrationCanvas"></canvas>
<script>
        // Confetti Effect for Success
        const canvas = document.getElementById('celebrationCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];
        const colors = ['#ffd600', '#006e1c', '#0061a4', '#ffe170'];

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + 10;
                this.size = Math.random() * 8 + 4;
                this.speedY = Math.random() * -5 - 3;
                this.speedX = Math.random() * 4 - 2;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.rotation = Math.random() * 360;
                this.spin = Math.random() * 10 - 5;
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                this.rotation += this.spin;
                this.speedY += 0.1; // Gravity
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation * Math.PI / 180);
                ctx.fillStyle = this.color;
                ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size);
                ctx.restore();
            }
        }

        function initParticles() {
            for(let i = 0; i < 50; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                p.update();
                p.draw();
                if (p.y > canvas.height + 20) {
                    particles.splice(index, 1);
                }
            });
            requestAnimationFrame(animate);
        }

        // Start animation on load
        setTimeout(() => {
            initParticles();
            animate();
        }, 300);

        // Interaction for the primary button
        document.querySelector('.clay-button-primary').addEventListener('click', () => {
            document.querySelector('main').classList.add('scale-0', 'opacity-0');
            setTimeout(() => {
                alert("Heading back to the city! Stay safe!");
            }, 300);
        });
    </script>
