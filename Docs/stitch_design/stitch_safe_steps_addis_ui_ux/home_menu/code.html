<script>
        // Simple particle effect for atmosphere
        const container = document.getElementById('particle-container');
        const particleCount = 15;
        
        for (let i = 0; i < particleCount; i++) {
            createParticle();
        }

        function createParticle() {
            const p = document.createElement('div');
            const size = Math.random() * 8 + 4;
            p.className = 'absolute bg-white/30 rounded-full blur-sm';
            p.style.width = size + 'px';
            p.style.height = size + 'px';
            p.style.left = Math.random() * 100 + 'vw';
            p.style.top = Math.random() * 100 + 'vh';
            p.style.opacity = Math.random();
            container.appendChild(p);

            animateParticle(p);
        }

        function animateParticle(el) {
            const duration = Math.random() * 5000 + 5000;
            const xMovement = (Math.random() - 0.5) * 100;
            const yMovement = -Math.random() * 200;

            el.animate([
                { transform: 'translate(0, 0)', opacity: el.style.opacity },
                { transform: `translate(${xMovement}px, ${yMovement}px)`, opacity: 0 }
            ], {
                duration: duration,
                easing: 'linear'
            }).onfinish = () => {
                el.style.left = Math.random() * 100 + 'vw';
                el.style.top = '100vh';
                animateParticle(el);
            };
        }
    </script>
