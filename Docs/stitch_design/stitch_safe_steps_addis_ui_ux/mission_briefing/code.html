<script>
        // Simple micro-interaction for the traffic light
        let activeLight = 0;
        const lights = document.querySelectorAll('.traffic-light-glow-red, .w-10.h-10.rounded-full');
        
        setInterval(() => {
            lights.forEach((l, idx) => {
                if (idx === 0) { // Red light (index 0)
                    l.style.opacity = '1';
                    l.classList.add('traffic-light-glow-red');
                } else {
                    l.style.opacity = '0.4';
                    l.classList.remove('traffic-light-glow-red');
                }
            });
        }, 2000);

        // Add haptic-like bounce to primary button
        const startBtn = document.querySelector('button.bg-primary-container');
        startBtn.addEventListener('click', () => {
            startBtn.style.transform = 'scale(0.95)';
            setTimeout(() => {
                startBtn.style.transform = 'scale(1)';
                // Logic to transition to mission start would go here
            }, 100);
        });
    </script>
