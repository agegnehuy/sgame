<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&amp;family=Quicksand:wght@500;600;700&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            overflow: hidden;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 700, 'GRAD' 0, 'opsz' 48;
        }
        .clay-button {
            transition: all 0.1s ease;
        }
        .clay-button:active {
            transform: translateY(4px);
            box-shadow: none !important;
        }
        .traffic-glow-red { box-shadow: 0 0 20px #ba1a1a; }
        .traffic-glow-yellow { box-shadow: 0 0 20px #ffd600; }
        .traffic-glow-green { box-shadow: 0 0 20px #006e1c; }
        
        /* Animated scanline effect for game feel */
        .game-overlay::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.05) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
            z-index: 10;
        }
    </style>

            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-fixed-variant": "#00497d",
                        "tertiary": "#0061a4",
                        "on-error-container": "#93000a",
                        "background": "#f3faff",
                        "on-tertiary-fixed": "#001d36",
                        "surface-container-low": "#e6f6ff",
                        "tertiary-container": "#c0dbff",
                        "outline": "#7f775f",
                        "secondary-container": "#91f78e",
                        "on-secondary-container": "#00731e",
                        "on-primary-container": "#705d00",
                        "on-tertiary": "#ffffff",
                        "error-container": "#ffdad6",
                        "tertiary-fixed": "#d1e4ff",
                        "inverse-primary": "#e9c400",
                        "on-primary-fixed": "#221b00",
                        "surface-container-high": "#d5ecf8",
                        "on-error": "#ffffff",
                        "error": "#ba1a1a",
                        "primary": "#705d00",
                        "surface-variant": "#cfe6f2",
                        "inverse-surface": "#1e333c",
                        "surface-dim": "#c7dde9",
                        "primary-fixed-dim": "#e9c400",
                        "secondary": "#006e1c",
                        "primary-container": "#ffd600",
                        "primary-fixed": "#ffe170",
                        "surface-container-highest": "#cfe6f2",
                        "tertiary-fixed-dim": "#9ecaff",
                        "on-secondary-fixed": "#002204",
                        "on-secondary": "#ffffff",
                        "on-surface": "#071e27",
                        "inverse-on-surface": "#dff4ff",
                        "secondary-fixed-dim": "#78dc77",
                        "surface-container": "#dbf1fe",
                        "secondary-fixed": "#94f990",
                        "outline-variant": "#d0c6ab",
                        "surface": "#f3faff",
                        "on-secondary-fixed-variant": "#005313",
                        "on-surface-variant": "#4d4632",
                        "on-tertiary-container": "#0061a4",
                        "on-primary-fixed-variant": "#544600",
                        "surface-bright": "#f3faff",
                        "on-primary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "surface-tint": "#705d00",
                        "on-background": "#071e27"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "touch-target-min": "48px",
                        "base": "8px",
                        "sm": "12px",
                        "md": "24px",
                        "xl": "64px",
                        "xs": "4px",
                        "lg": "40px"
                    },
                    "fontFamily": {
                        "body-md": ["Quicksand"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "headline-md": ["Plus Jakarta Sans"],
                        "body-lg": ["Quicksand"],
                        "label-lg": ["Quicksand"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "display-lg": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "500"}],
                        "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "800"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                        "body-lg": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "label-lg": ["14px", {"lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "700"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "800"}],
                        "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800"}]
                    }
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md h-screen w-screen relative overflow-hidden">
<!-- Game Canvas / World Area -->
<div class="absolute inset-0 z-0 bg-surface-variant overflow-hidden">
<img alt="Game World" class="w-full h-full object-cover" data-alt="A vibrant 3D stylized cartoon city street in Addis Ababa during a bright sunny day. A wide zebra crossing is in the foreground where a young student character with a safety helmet stands ready to cross. In the background, colorful stylized blue and white Lada taxis and modern cars are stopped. The art style is high-energy, tactile-digital with soft clay-morphic textures and warm optimistic lighting that makes the environment feel like a friendly educational game world." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDEe4HJnvxuWwERVeVJjoYIyXr8Xt_AkpqttlZM1f30Juz4E5LkB7lI3MS6Z2H5NDN7cOYEKisB6525zX2JH9HtsjASfgHnITvjjyfe9mQQjlBrlHDcuG4yskqYzOBE-JcXUABrbobIyWTLtxOFykr4KOlJnW2v9gqwIWJkF4Y904I366LO8pm8wcucnHXDHzqEzSAtf4IJJHUQ3hXp5-JwhGw2O-nS5nkbkTKrR4Ay6FsWY24ewnzWCO16icx2qHU7yuiRC3HN8EnM"/>
<!-- Animated Character Placeholder (Simplified UI version) -->
<div class="absolute bottom-1/4 left-1/2 -translate-x-1/2 w-32 h-48 pointer-events-none transition-all duration-500 transform" id="gameCharacter">
<div class="w-full h-full bg-primary-container rounded-xl border-4 border-on-primary-container shadow-xl flex flex-col items-center justify-center p-4">
<span class="material-symbols-outlined text-[64px] text-on-primary-container" style="font-variation-settings: 'FILL' 1;">directions_walk</span>
<span class="font-headline-md text-on-primary-container">YOU</span>
</div>
</div>
</div>
<!-- HUD Overlay -->
<div class="relative z-20 h-full flex flex-col justify-between p-md pointer-events-none">
<!-- Top Section: Traffic Light & Stats -->
<div class="flex justify-between items-start w-full">
<!-- Traffic Light Indicator -->
<div class="bg-inverse-surface p-sm rounded-lg border-4 border-outline-variant shadow-lg pointer-events-auto flex flex-col gap-xs">
<div class="w-12 h-12 rounded-full bg-error border-2 border-on-error opacity-100 traffic-glow-red transition-all duration-300" id="light-red"></div>
<div class="w-12 h-12 rounded-full bg-primary border-2 border-on-primary opacity-30 transition-all duration-300" id="light-yellow"></div>
<div class="w-12 h-12 rounded-full bg-secondary border-2 border-on-secondary opacity-30 transition-all duration-300" id="light-green"></div>
</div>
<!-- Stats & Missions Panel -->
<div class="flex flex-col gap-sm items-end pointer-events-auto">
<!-- Coin Count -->
<div class="bg-surface-container-highest px-md py-sm rounded-xl border-b-4 border-outline-variant flex items-center gap-base shadow-md">
<span class="material-symbols-outlined text-primary text-[28px]" style="font-variation-settings: 'FILL' 1;">monetization_on</span>
<span class="font-headline-md text-primary" id="coinCount">1,240</span>
</div>
<!-- Mission Objective -->
<div class="bg-white/90 backdrop-blur-md p-md rounded-lg border-b-4 border-surface-variant max-w-[200px] shadow-lg">
<p class="text-label-lg text-on-surface-variant mb-xs">MISSION</p>
<p class="font-body-lg text-on-surface leading-tight">Wait for the <span class="text-secondary font-bold">Green Light</span> to cross safely!</p>
</div>
</div>
</div>
<!-- Center Prompt (Appears contextually) -->
<div class="flex-grow flex items-center justify-center">
<div class="bg-primary px-lg py-md rounded-xl shadow-[0_8px_0_0_#544600] border-2 border-white transform scale-110 opacity-0 transition-all duration-300" id="actionPrompt">
<p class="font-headline-lg-mobile text-on-primary">STOP!</p>
</div>
</div>
<!-- Bottom Controls: Directional Pad -->
<div class="flex flex-col items-center gap-md">
<!-- Progress Bar -->
<div class="w-full bg-surface-container-low h-8 rounded-full border-4 border-white shadow-inner overflow-hidden pointer-events-auto">
<div class="bg-secondary-container h-full w-[45%] rounded-full shadow-[inset_0_2px_4px_rgba(0,0,0,0.1)] flex items-center justify-end px-md">
<span class="text-label-lg text-on-secondary-container">LEVEL 4</span>
</div>
</div>
<!-- Joystick / Movement Cluster -->
<div class="w-full flex justify-between items-end pointer-events-auto pb-xl">
<!-- Left D-Pad -->
<div class="grid grid-cols-3 gap-xs">
<div></div>
<button class="clay-button w-touch-target-min h-touch-target-min bg-tertiary-container rounded-lg border-b-4 border-on-tertiary-fixed-variant flex items-center justify-center shadow-md">
<span class="material-symbols-outlined text-on-tertiary-fixed-variant">keyboard_arrow_up</span>
</button>
<div></div>
<button class="clay-button w-touch-target-min h-touch-target-min bg-tertiary-container rounded-lg border-b-4 border-on-tertiary-fixed-variant flex items-center justify-center shadow-md">
<span class="material-symbols-outlined text-on-tertiary-fixed-variant">keyboard_arrow_left</span>
</button>
<button class="clay-button w-touch-target-min h-touch-target-min bg-tertiary-container rounded-lg border-b-4 border-on-tertiary-fixed-variant flex items-center justify-center shadow-md">
<span class="material-symbols-outlined text-on-tertiary-fixed-variant">keyboard_arrow_down</span>
</button>
<button class="clay-button w-touch-target-min h-touch-target-min bg-tertiary-container rounded-lg border-b-4 border-on-tertiary-fixed-variant flex items-center justify-center shadow-md">
<span class="material-symbols-outlined text-on-tertiary-fixed-variant">keyboard_arrow_right</span>
</button>
</div>
<!-- Right Action Button -->
<button class="clay-button w-xl h-xl bg-primary-container rounded-full border-b-[8px] border-on-primary-fixed-variant flex items-center justify-center shadow-xl group" id="crossBtn">
<span class="material-symbols-outlined text-[40px] text-on-primary-container transition-transform group-active:scale-90" style="font-variation-settings: 'FILL' 1;">directions_run</span>
</button>
</div>
</div>
</div>
<!-- Gameplay Overlay Effects -->
<div class="game-overlay absolute inset-0 pointer-events-none z-30"></div>
<script>
        // Simple Game Logic Simulation
        const lights = {
            red: document.getElementById('light-red'),
            yellow: document.getElementById('light-yellow'),
            green: document.getElementById('light-green')
        };
        const prompt = document.getElementById('actionPrompt');
        const character = document.getElementById('gameCharacter');
        let currentLight = 'red';

        function updateTrafficLight() {
            // Cycle: Red (5s) -> Green (5s) -> Yellow (2s)
            if (currentLight === 'red') {
                currentLight = 'green';
                lights.red.classList.add('opacity-30');
                lights.red.classList.remove('traffic-glow-red');
                lights.green.classList.remove('opacity-30');
                lights.green.classList.add('traffic-glow-green');
                prompt.querySelector('p').innerText = 'GO GO GO!';
                prompt.className = prompt.className.replace('bg-primary', 'bg-secondary').replace('opacity-0', 'opacity-100');
                setTimeout(() => {
                    prompt.classList.add('opacity-0');
                }, 2000);
                setTimeout(updateTrafficLight, 5000);
            } else if (currentLight === 'green') {
                currentLight = 'yellow';
                lights.green.classList.add('opacity-30');
                lights.green.classList.remove('traffic-glow-green');
                lights.yellow.classList.remove('opacity-30');
                lights.yellow.classList.add('traffic-glow-yellow');
                setTimeout(updateTrafficLight, 2000);
            } else {
                currentLight = 'red';
                lights.yellow.classList.add('opacity-30');
                lights.yellow.classList.remove('traffic-glow-yellow');
                lights.red.classList.remove('opacity-30');
                lights.red.classList.add('traffic-glow-red');
                prompt.querySelector('p').innerText = 'WAIT!';
                prompt.className = prompt.className.replace('bg-secondary', 'bg-error').replace('opacity-0', 'opacity-100');
                setTimeout(() => {
                    prompt.classList.add('opacity-0');
                }, 2000);
                setTimeout(updateTrafficLight, 5000);
            }
        }

        // Action Logic
        document.getElementById('crossBtn').addEventListener('click', () => {
            if (currentLight === 'green') {
                character.style.transform = 'translate(-50%, -150%) scale(0.8)';
                setTimeout(() => {
                    character.style.transform = 'translate(-50%, 0%) scale(1)';
                }, 1000);
            } else {
                // Shake effect for wrong move
                character.classList.add('animate-bounce');
                setTimeout(() => character.classList.remove('animate-bounce'), 500);
            }
        });

        // Start the simulation
        setTimeout(updateTrafficLight, 3000);

        // Add some coin particles effect simulation
        document.getElementById('coinCount').parentElement.addEventListener('click', function() {
            const count = parseInt(this.innerText.replace(',', ''));
            document.getElementById('coinCount').innerText = (count + 10).toLocaleString();
        });
    </script>
</body></html>
